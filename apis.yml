name: Matterway
description: 'Matterway is an enterprise-grade, AI-native intelligent assistance platform built for
  operations teams at large organizations and BPOs. Its screen-aware digital Assistant sits on top of
  the systems employees already use, guiding people through complex workflows while automating document
  data extraction, data verification, form pre-fill, and cross-application navigation. Processing stays
  client-side inside the corporate network, and the Assistant acts with the same rights as the logged-in
  user, which is aimed at regulated industries such as banking, insurance, and healthcare. Skills are
  authored in a no-code Designer, exported to a low-code SDK, and monitored from a management console.
  Matterway was acquired by Cognizant in October 2025. This profile was added to the API Evangelist
  network as a portfolio company of HV Capital and enriched by the local pipeline; Matterway publishes
  no public developer API, SDK registry package, or OpenAPI at this time.'
